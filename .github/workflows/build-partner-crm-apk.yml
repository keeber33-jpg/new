name: Build Partner CRM Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PartnerCRM_Android/**'
      - '.github/workflows/build-partner-crm-apk.yml'
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PartnerCRM_Android
    steps:
      - uses: actions/checkout@v4
      - name: Check CRM JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/crm-script-{i}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} JavaScript blocks')
          PY
          for file in /tmp/crm-script-*.js; do node --check "$file"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PartnerCRM-debug-apk
          path: PartnerCRM_Android/app/build/outputs/apk/debug/app-debug.apk
