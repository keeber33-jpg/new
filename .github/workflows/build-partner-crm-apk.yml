name: Build Partner CRM Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PartnerCRM_Android/**'
      - '.github/workflows/build-partner-crm-apk.yml'
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PartnerCRM_Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PartnerCRM-debug-apk
          path: PartnerCRM_Android/app/build/outputs/apk/debug/app-debug.apk
